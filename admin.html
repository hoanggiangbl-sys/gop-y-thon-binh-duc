<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Góp Ý Cử Tri - Thôn Bình Đức</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1a66ff; text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-box { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"], select { padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        input[type="text"] { width: 250px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e0e0e0; padding: 10px 12px; text-align: left; vertical-align: middle; font-size: 13.5px; }
        th { background: #1a66ff; color: white; font-weight: 600; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn-export { background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
        select.status-select { padding: 5px 8px; border-radius: 6px; border: 1px solid #ccc; font-weight: 600; font-size: 13px; }
        .img-thumb { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; }
        
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-list-check"></i> TRANG QUẢN LÝ GÓP Ý CỬ TRI - THÔN BÌNH ĐỨC</h1>

    <div class="controls">
        <div class="filter-box">
            <input type="text" id="searchInput" placeholder="Tìm theo tên, SĐT, địa chỉ, nội dung..." onkeyup="filterData()">
            <select id="statusFilter" onchange="filterData()">
                <option value="all">-- Tất cả trạng thái --</option>
                <option value="pending">Mới tiếp nhận</option>
                <option value="processing">Đang xử lý</option>
                <option value="completed">Đã giải quyết</option>
            </select>
        </div>
        <button class="btn-export" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Xuất danh sách Excel</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 4%; text-align: center;">STT</th>
                <th style="width: 13%">Thời gian gửi</th>
                <th style="width: 13%">Họ tên cử tri</th>
                <th style="width: 10%">Số điện thoại</th>
                <th style="width: 12%">Địa chỉ / Xóm</th>
                <th>Nội dung góp ý / Phản ánh</th>
                <th style="width: 7%; text-align: center;">Hình ảnh</th>
                <th style="width: 13%">Trạng thái</th>
                <th style="width: 4%; text-align: center;">Xóa</th>
            </tr>
        </thead>
        <tbody id="feedbackList">
            <tr><td colspan="9" style="text-align: center;">Đang tải dữ liệu từ máy chủ...</td></tr>
        </tbody>
    </table>
</div>

<div class="modal" id="imageModal" onclick="this.style.display='none'">
    <img id="modalImg" src="" alt="Ảnh phóng to">
</div>

<script>
    // THAY THẾ CẤU HÌNH FIREBASE MỚI CỦA THÔN BÌNH ĐỨC VÀO ĐÂY:
    const firebaseConfig = {
  apiKey: "AIzaSyBvNKP7IgBqQtujRiwjK44fwsC-FYG6Cb4",
  authDomain: "gop-y-thon-binh-duc.firebaseapp.com",
  databaseURL: "https://gop-y-thon-binh-duc-default-rtdb.firebaseio.com",
  projectId: "gop-y-thon-binh-duc",
  storageBucket: "gop-y-thon-binh-duc.firebasestorage.app",
  messagingSenderId: "35340837576",
  appId: "1:35340837576:web:3fb1d9521f6b9aafdc3bfd",
  measurementId: "G-CZL9V5H9VX"
};

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let rawData = [];

    database.ref('feedbacks').on('value', (snapshot) => {
        rawData = [];
        snapshot.forEach((child) => {
            rawData.unshift({
                id: child.key,
                ...child.val()
            });
        });
        filterData();
    });

    function renderTable(data) {
        const tbody = document.getElementById('feedbackList');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; padding: 20px; color: #777;">Chưa có dữ liệu phản ánh nào.</td></tr>';
            return;
        }

        data.forEach((item, index) => {
            const date = item.timestamp ? new Date(item.timestamp).toLocaleString('vi-VN') : 'Không xác định';
            
            const imageHtml = item.imageUrl 
                ? `<img src="${item.imageUrl}" class="img-thumb" onclick="showModal('${item.imageUrl}')" title="Bấm để xem ảnh lớn">` 
                : '<span style="color:#ccc;">Không có</span>';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold;">${index + 1}</td>
                <td>${date}</td>
                <td><b>${item.fullname || 'Ẩn danh'}</b></td>
                <td>${item.phone || 'Chưa cung cấp'}</td>
                <td>${item.address || 'Chưa nhập'}</td>
                <td>${item.content || ''}</td>
                <td style="text-align: center;">${imageHtml}</td>
                <td>
                    <select class="status-select" onchange="updateStatus('${item.id}', this.value)">
                        <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Mới tiếp nhận</option>
                        <option value="processing" ${item.status === 'processing' ? 'selected' : ''}>Đang xử lý</option>
                        <option value="completed" ${item.status === 'completed' ? 'selected' : ''}>Đã giải quyết</option>
                    </select>
                </td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteItem('${item.id}')" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }

    function updateStatus(id, newStatus) {
        database.ref('feedbacks/' + id).update({ status: newStatus });
    }

    function deleteItem(id) {
        if (confirm('Bạn có chắc chắn muốn xóa phản ánh này khỏi hệ thống?')) {
            database.ref('feedbacks/' + id).remove();
        }
    }

    function filterData() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const status = document.getElementById('statusFilter').value;

        const filtered = rawData.filter(item => {
            const fullname = (item.fullname || '').toLowerCase();
            const phone = (item.phone || '').toLowerCase();
            const address = (item.address || '').toLowerCase();
            const content = (item.content || '').toLowerCase();

            const matchQuery = fullname.includes(query) || phone.includes(query) || address.includes(query) || content.includes(query);
            const matchStatus = status === 'all' || item.status === status;

            return matchQuery && matchStatus;
        });

        renderTable(filtered);
    }

    function exportToExcel() {
        if (rawData.length === 0) {
            alert('Chưa có dữ liệu để xuất Excel!');
            return;
        }

        const exportData = rawData.map((item, idx) => ({
            "STT": idx + 1,
            "Thời Gian": item.timestamp ? new Date(item.timestamp).toLocaleString('vi-VN') : '',
            "Họ và Tên": item.fullname || '',
            "Số Điện Thoại": item.phone || '',
            "Địa Chỉ / Xóm": item.address || '',
            "Nội Dung Phản Ánh": item.content || '',
            "Có Hình Ảnh": item.imageUrl ? 'Có' : 'Không',
            "Trạng Thái": item.status === 'pending' ? 'Mới tiếp nhận' : (item.status === 'processing' ? 'Đang xử lý' : 'Đã giải quyết')
        }));

        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Gop_Y_Cu_Tri");
        XLSX.writeFile(wb, "Danh_Sach_Gop_Y_Thon_Binh_Duc.xlsx");
    }
</script>

</body>
</html>
